name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    # `npm run check` is coverage-gated and the store conformance suite covers
    # PostgreSQL, so the publish gate needs the same database CI has. Without it
    # the PostgreSQL suite skips, coverage drops below threshold, and the release
    # fails at the gate.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localwebauthn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOCALWEBAUTHN_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/localwebauthn_test
      # Never publish a build whose PostgreSQL conformance suite silently skipped.
      LOCALWEBAUTHN_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release versions
        run: |
          SERVER_VERSION="$(node -p "require('./packages/server/package.json').version")"
          BROWSER_VERSION="$(node -p "require('./packages/browser/package.json').version")"
          CLIENT_VERSION="$(node -p "require('./packages/client/package.json').version")"
          # All three packages release as one version set.
          test "$SERVER_VERSION" = "$BROWSER_VERSION"
          test "$SERVER_VERSION" = "$CLIENT_VERSION"
          test "$GITHUB_REF_NAME" = "v$SERVER_VERSION"
      - run: npm run check
      # A prerelease must not become `latest`, or `npm install @localwebauthn/server`
      # starts handing everyone an rc. Derive the dist-tag from the version: anything
      # with a hyphen (3.0.0-rc.1) publishes under `next`, a final version under
      # `latest`. Plain `npm publish` would tag every version `latest`.
      - name: Choose the npm dist-tag
        run: |
          VERSION="$(node -p "require('./packages/server/package.json').version")"
          case "$VERSION" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - run: npm publish --workspace @localwebauthn/server --tag "$NPM_TAG"
      - run: npm publish --workspace @localwebauthn/browser --tag "$NPM_TAG"
      - run: npm publish --workspace @localwebauthn/client --tag "$NPM_TAG"
